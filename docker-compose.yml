services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: utescihub
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-service:
    build:
      context: ./
    container_name: backend-service
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:mysql://ute-sci-db.mysql.database.azure.com:3306/utescihub
      - DATABASE_USERNAME=tuanlt
      - DATABASE_PASSWORD=Thanhtuanle939@
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: